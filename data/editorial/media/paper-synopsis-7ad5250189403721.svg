<text x="126" y="862" font-family="Arial,sans-serif" font-size="24" fill="#075e62" font-weight="700">DE QUÉ TRATA</text><text x="126" y="906" class="psummary">El financiamiento de la educación superior pública en</text><text x="126" y="949" class="psummary">Colombia representa un pilar estratégico para el</text><text x="126" y="992" class="psummary">desarrollo académico y la innovación social. Este</text><text x="126" y="1035" class="psummary">artículo analiza integralmente el modelo de asignación</text><text x="126" y="1078" class="psummary">de recursos públicos a las Instituciones de Educación</text><text x="126" y="1121" class="psummary">Superior, explorando su evolución desde el carácter</text><text x="126" y="1164" class="psummary">elitista del periodo colonial hasta el marco normativo</text><text x="126" y="1207" class="psummary">contemporáneo definido por la Ley 30 de 1992…</text>
