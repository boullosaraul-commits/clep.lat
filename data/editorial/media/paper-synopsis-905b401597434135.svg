<text x="126" y="862" font-family="Arial,sans-serif" font-size="24" fill="#075e62" font-weight="700">DE QUÉ TRATA</text><text x="126" y="906" class="psummary">El trabajo propone una estructura de capital</text><text x="126" y="949" class="psummary">reciclable que distingue de la deuda, el capital</text><text x="126" y="992" class="psummary">accionario y las subvenciones. Su argumento es formal:</text><text x="126" y="1035" class="psummary">evitar ciertas extracciones permite reutilizar una</text><text x="126" y="1078" class="psummary">misma base en varios ciclos. El propio autor aclara</text><text x="126" y="1121" class="psummary">que, si la tasa de reciclaje es inferior a uno, el</text><text x="126" y="1164" class="psummary">fondo disminuye; la arquitectura no garantiza</text><text x="126" y="1207" class="psummary">crecimiento ni perpetuidad. La tasa efectiva de…</text>
