<text x="126" y="862" font-family="Arial,sans-serif" font-size="24" fill="#075e62" font-weight="700">DE QUÉ TRATA</text><text x="126" y="906" class="psummary">Este estudio examina la integración de la inteligencia</text><text x="126" y="949" class="psummary">artificial (AI) en el modelo TPACK (Conocimiento</text><text x="126" y="992" class="psummary">Tecnológico del Contenido Pedagógico) a través del</text><text x="126" y="1035" class="psummary">análisis de validación y fiabilidad de un instrumento</text><text x="126" y="1078" class="psummary">llamado TPACK-AI. Se utilizó un diseño cuantitativo</text><text x="126" y="1121" class="psummary">con una muestra de 407 profesores universitarios de</text><text x="126" y="1164" class="psummary">México, Colombia y Chile. Los resultados indican la</text><text x="126" y="1207" class="psummary">alta consistencia interna del instrumento (McDonald&#x27;s…</text>
