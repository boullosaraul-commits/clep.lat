<text x="126" y="862" font-family="Arial,sans-serif" font-size="24" fill="#075e62" font-weight="700">DE QUÉ TRATA</text><text x="126" y="906" class="psummary">El artículo analiza cómo las trabajadoras temporales</text><text x="126" y="949" class="psummary">de la fruticultura de exportación en Chillán y San</text><text x="126" y="992" class="psummary">Nicolás combinan empleo asalariado, trabajo doméstico</text><text x="126" y="1035" class="psummary">y otras actividades productivas. A partir de una</text><text x="126" y="1078" class="psummary">investigación cualitativa, examina la gestión del</text><text x="126" y="1121" class="psummary">tiempo y los recursos en hogares vinculados a la</text><text x="126" y="1164" class="psummary">agricultura, la alfarería y el trabajo temporal. Las</text><text x="126" y="1207" class="psummary">autoras distinguen distintas estrategias de obtención…</text>
