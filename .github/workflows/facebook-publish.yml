name: Facebook schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "45 13 * * *"
    - cron: "25 5 * * *"

permissions:
  contents: write

concurrency:
  group: facebook-schedule
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic SVG rasterizer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Validate editorial queue
        run: python scripts/editorial/verificar_cola.py

      - name: Schedule approved posts in Facebook
        env:
          CLEP_FB_TOKEN: ${{ secrets.CLEP_FB_TOKEN }}
          CLEP_FB_PAGE_ID: ${{ secrets.CLEP_FB_PAGE_ID }}
          META_GRAPH_VERSION: "v26.0"
        run: python scripts/editorial/programar_facebook.py

      - name: Verify replacements and retire historical originals
        env:
          CLEP_FB_TOKEN: ${{ secrets.CLEP_FB_TOKEN }}
          META_GRAPH_VERSION: "v26.0"
        run: python scripts/editorial/cerrar_reemplazos_facebook.py

      - name: Persist Meta state
        run: |
          if git diff --quiet -- data/editorial/cola.csv; then
            echo "No Meta state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial/cola.csv
          git commit -m "editorial: record Facebook publication state"
          git pull --rebase origin main
          git push
