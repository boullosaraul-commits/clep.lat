name: Facebook schedule

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clep-editorial
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic SVG rasterizer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Validate editorial queue
        run: python scripts/editorial/verificar_cola.py

      - name: Verify Meta credentials
        env:
          CLEP_FB_TOKEN: ${{ secrets.CLEP_FB_TOKEN }}
          CLEP_FB_PAGE_ID: ${{ secrets.CLEP_FB_PAGE_ID }}
          META_GRAPH_VERSION: "v26.0"
        run: python scripts/editorial/verificar_meta.py

      - name: Schedule reserved posts one by one
        env:
          CLEP_FB_TOKEN: ${{ secrets.CLEP_FB_TOKEN }}
          CLEP_FB_PAGE_ID: ${{ secrets.CLEP_FB_PAGE_ID }}
          META_GRAPH_VERSION: "v26.0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 16); do
            rm -f /tmp/clep_meta_attempt_id
            set +e
            python scripts/editorial/marcar_intento_meta.py --output /tmp/clep_meta_attempt_id
            mark_rc=$?
            set -e
            if [ "$mark_rc" -eq 3 ]; then
              echo "No more posts to reserve."
              break
            fi
            if [ "$mark_rc" -ne 0 ]; then
              exit "$mark_rc"
            fi

            eid="$(cat /tmp/clep_meta_attempt_id)"
            git add data/editorial/cola.csv
            git commit -m "editorial: reserve Meta attempt $eid"
            git pull --rebase origin main
            git push

            set +e
            python scripts/editorial/programar_facebook.py --editorial-id "$eid"
            publish_rc=$?
            set -e

            if ! git diff --quiet -- data/editorial/cola.csv; then
              git add data/editorial/cola.csv
              git commit -m "editorial: record Meta attempt $eid"
              git pull --rebase origin main
              git push
            fi

            if [ "$publish_rc" -ne 0 ]; then
              echo "Meta attempt $eid requires review; continuing without automatic retry."
            fi
          done

      - name: Verify published Facebook posts
        env:
          CLEP_FB_TOKEN: ${{ secrets.CLEP_FB_TOKEN }}
          META_GRAPH_VERSION: "v26.0"
        run: python scripts/editorial/verificar_publicaciones_facebook.py

      - name: Verify replacements and retire historical originals
        env:
          CLEP_FB_TOKEN: ${{ secrets.CLEP_FB_TOKEN }}
          META_GRAPH_VERSION: "v26.0"
        run: python scripts/editorial/cerrar_reemplazos_facebook.py

      - name: Persist verified Meta state
        run: |
          python scripts/editorial/verificar_cola.py
          if git diff --quiet -- data/editorial/cola.csv; then
            echo "No final Meta state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial/cola.csv
          git commit -m "editorial: record verified Facebook publication state"
          git pull --rebase origin main
          git push
