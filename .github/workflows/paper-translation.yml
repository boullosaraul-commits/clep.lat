name: CLEP paper translation

on:
  workflow_dispatch:
  schedule:
    - cron: "5 11 * * *"

permissions:
  contents: write

concurrency:
  group: clep-paper-translation
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Argos Translate EN-ES
        run: |
          python -m pip install --disable-pip-version-check -q argostranslate
          python scripts/editorial/instalar_argos_en_es.py
      - name: Translate English paper metadata
        run: python scripts/editorial/traducir_papers.py
      - name: Persist translations
        run: |
          if git diff --quiet -- data/editorial/candidatos.csv; then
            echo "No paper translations changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial/candidatos.csv
          git commit -m "editorial: translate paper titles and abstracts"
          git pull --rebase origin main
          git push
