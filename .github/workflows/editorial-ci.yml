name: Editorial CI

on:
  push:
    branches: [main]
    paths:
      - "scripts/editorial/**"
      - "recovery/**"
      - "data/editorial/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "scripts/editorial/**"
      - "recovery/**"
      - "data/editorial/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static undefined-name check
        run: |
          python -m pip install --disable-pip-version-check -q ruff
          ruff check scripts recovery tests --select F821,F822,F823
      - name: Compile Python
        run: python -m compileall -q scripts recovery tests
      - name: Unit tests
        run: |
          python -m unittest -v tests/test_editorial.py
          python -m unittest -v tests/test_editorial_schema.py
          python -m unittest -v tests/test_editorial_rules.py
          python -m unittest -v tests/test_text_renderer.py
          python -m unittest -v tests/test_media_resolver.py
          python -m unittest -v tests/test_media_validator.py
      - name: Deterministic text multiformat E2E
        run: python tests/text_renderer_e2e.py
      - name: Deterministic media resolution and validation E2E
        run: python tests/media_resolution_e2e.py
      - name: Deterministic editorial end-to-end dry run
        run: python tests/editorial_e2e.py
      - name: Validate current queue
        run: python scripts/editorial/verificar_cola.py
