name: CLEP daily editorial pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "10 11 * * *"

permissions:
  contents: write

concurrency:
  group: clep-editorial
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic image rasterizer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Ingest and prepare current content
        run: |
          python scripts/editorial/migrar_nep_legacy.py
          python scripts/editorial/ingerir_feeds.py
          python scripts/editorial/ingerir_nep.py
          python scripts/editorial/enriquecer_repec.py
          python scripts/editorial/ingerir_doab.py
          python scripts/editorial/ingerir_novedades_academicas.py
          python scripts/editorial/ingerir_catalogos.py
          python scripts/editorial/detectar_actualizaciones.py
          python scripts/editorial/verificar_oa.py
          python scripts/editorial/evaluar_candidatos.py
          python scripts/editorial/preparar_publicacion.py
          python scripts/editorial/verificar_cola.py

      - name: Persist current-source state
        run: |
          if git diff --quiet -- data/editorial; then
            echo "No current-source changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/editorial
            git commit -m "editorial: ingest current sources"
            git pull --rebase origin main
            git push
          fi

      - name: Verify Meta credentials before Facebook-dependent work
        env:
          CLEP_FB_TOKEN: ${{ secrets.CLEP_FB_TOKEN }}
          CLEP_FB_PAGE_ID: ${{ secrets.CLEP_FB_PAGE_ID }}
          META_GRAPH_VERSION: "v26.0"
        run: python scripts/editorial/verificar_meta.py

      - name: Recover up to 10 historical cases
        env:
          CLEP_FB_TOKEN: ${{ secrets.CLEP_FB_TOKEN }}
          CLEP_FB_PAGE_ID: ${{ secrets.CLEP_FB_PAGE_ID }}
          META_GRAPH_VERSION: "v26.0"
        run: python recovery/historical_worker.py

      - name: Plan next day
        run: |
          python scripts/editorial/verificar_cola.py
          python scripts/editorial/planificar.py
          python scripts/editorial/verificar_cola.py

      - name: Persist historical and schedule state before Meta writes
        run: |
          if git diff --quiet -- data/editorial recovery/state; then
            echo "No pre-Meta state changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/editorial
            git add -f recovery/state/historical_recovery.json || true
            git commit -m "editorial: prepare daily Facebook queue"
            git pull --rebase origin main
            git push
          fi

      - name: Schedule image posts one by one with durable reservations
        env:
          CLEP_FB_TOKEN: ${{ secrets.CLEP_FB_TOKEN }}
          CLEP_FB_PAGE_ID: ${{ secrets.CLEP_FB_PAGE_ID }}
          META_GRAPH_VERSION: "v26.0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 16); do
            rm -f /tmp/clep_meta_attempt_id
            set +e
            python scripts/editorial/marcar_intento_meta.py --output /tmp/clep_meta_attempt_id
            mark_rc=$?
            set -e
            if [ "$mark_rc" -eq 3 ]; then
              echo "No more posts to reserve."
              break
            fi
            if [ "$mark_rc" -ne 0 ]; then
              exit "$mark_rc"
            fi

            eid="$(cat /tmp/clep_meta_attempt_id)"
            git add data/editorial/cola.csv
            git commit -m "editorial: reserve Meta attempt $eid"
            git pull --rebase origin main
            git push

            set +e
            python scripts/editorial/programar_facebook.py --editorial-id "$eid"
            publish_rc=$?
            set -e

            if ! git diff --quiet -- data/editorial/cola.csv; then
              git add data/editorial/cola.csv
              git commit -m "editorial: record Meta attempt $eid"
              git pull --rebase origin main
              git push
            fi

            if [ "$publish_rc" -ne 0 ]; then
              echo "Meta attempt $eid requires review; continuing without automatic retry."
            fi
          done

      - name: Verify already published posts
        env:
          CLEP_FB_TOKEN: ${{ secrets.CLEP_FB_TOKEN }}
          META_GRAPH_VERSION: "v26.0"
        run: python scripts/editorial/verificar_publicaciones_facebook.py

      - name: Retire historical originals only after verified replacement
        env:
          CLEP_FB_TOKEN: ${{ secrets.CLEP_FB_TOKEN }}
          META_GRAPH_VERSION: "v26.0"
        run: python scripts/editorial/cerrar_reemplazos_facebook.py

      - name: Validate and persist Meta state
        run: |
          python scripts/editorial/verificar_cola.py
          if git diff --quiet -- data/editorial/cola.csv; then
            echo "No Meta state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial/cola.csv
          git commit -m "editorial: record verified Meta state"
          git pull --rebase origin main
          git push
