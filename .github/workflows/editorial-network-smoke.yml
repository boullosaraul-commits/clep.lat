name: Editorial network smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/editorial-network-smoke.yml"
      - "scripts/editorial/ingerir_nep.py"
      - "scripts/editorial/enriquecer_repec.py"
      - "scripts/editorial/ingerir_doab.py"
      - "scripts/editorial/ingerir_novedades_academicas.py"
      - "scripts/editorial/verificar_cola.py"
      - "scripts/editorial/planificar.py"
      - "data/editorial/programacion.json"
      - "data/editorial/plantillas.json"
      - "data/editorial/fuentes.json"
      - "scripts/editorial/verificar_oa.py"
      - "scripts/editorial/reconciliar_meta.py"
      - "data/editorial/prioridad_editorial.json"
      - "scripts/editorial/auditar_prioridad.py"
      - "scripts/editorial/calcular_prioridad_editorial.py"
      - "data/editorial/pertinencia_doab.json"
      - "scripts/editorial/preparar_publicacion.py"
      - "scripts/editorial/evaluar_candidatos.py"
      - "scripts/editorial/ingerir_catalogos.py"
      - "scripts/editorial/detectar_actualizaciones.py"

permissions:
  contents: read

concurrency:
  group: editorial-network-smoke-v3
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Migrate legacy candidates
        run: python scripts/editorial/migrar_nep_legacy.py
      - name: Test NEP discovery and RePEc enrichment
        env:
          REPEC_ENRICH_LIMIT: "10"
        run: |
          python scripts/editorial/ingerir_nep.py
          python scripts/editorial/enriquecer_repec.py
      - name: Test books and structured catalogs
        run: |
          python scripts/editorial/ingerir_doab.py
          ACADEMIC_QUERY_LIMIT=1 CROSSREF_ROWS=5 ACADEMIC_OAI_MAX_RECORDS=20 python scripts/editorial/ingerir_novedades_academicas.py
          python scripts/editorial/ingerir_catalogos.py
      - name: Test statistical adapters
        run: python scripts/editorial/detectar_actualizaciones.py
      - name: Evaluate, prepare, and validate without publishing
        run: |
          python scripts/editorial/verificar_oa.py
          python scripts/editorial/evaluar_candidatos.py
          python scripts/editorial/calcular_prioridad_editorial.py
          python scripts/editorial/auditar_prioridad.py
          python scripts/editorial/preparar_publicacion.py
          python scripts/editorial/verificar_cola.py
