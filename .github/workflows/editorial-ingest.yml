name: Editorial ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: write

concurrency:
  group: editorial-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ingest configured feeds
        run: python scripts/editorial/ingerir_feeds.py

      - name: Ingest NEP reports
        run: python scripts/editorial/ingerir_nep.py

      - name: Enrich RePEc metadata
        run: python scripts/editorial/enriquecer_repec.py

      - name: Install non-generative translator
        run: pip install argostranslate

      - name: Translate abstracts to Spanish
        run: python scripts/editorial/traducir_abstracts.py

      - name: Evaluate candidates
        run: python scripts/editorial/evaluar_candidatos.py

      - name: Validate editorial queue
        run: python scripts/editorial/verificar_cola.py

      - name: Commit candidate changes
        run: |
          if git diff --quiet -- data/editorial/candidatos.csv; then
            echo "No new candidates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial/candidatos.csv
          git commit -m "editorial: ingest new candidates"
          git push
