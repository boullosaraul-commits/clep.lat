name: Editorial ingest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clep-editorial
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ingest configured feeds
        run: python scripts/editorial/ingerir_feeds.py

      - name: Ingest NEP reports
        run: python scripts/editorial/ingerir_nep.py

      - name: Enrich RePEc metadata
        run: python scripts/editorial/enriquecer_repec.py

      - name: Ingest recent DOAB books
        run: python scripts/editorial/ingerir_doab.py

      - name: Ingest structured events and videos
        run: python scripts/editorial/ingerir_catalogos.py

      - name: Detect statistical updates
        run: python scripts/editorial/detectar_actualizaciones.py

      - name: Evaluate thematic relevance before access verification
        run: python scripts/editorial/evaluar_candidatos.py

      - name: Verify public access and OA evidence by prepublication potential
        run: python scripts/editorial/verificar_oa.py

      - name: Calculate editorial priority
        run: |
          python scripts/editorial/calcular_prioridad_editorial.py
          python scripts/editorial/auditar_prioridad.py

      - name: Prepare candidates atomically
        run: python scripts/editorial/preparar_publicacion.py

      - name: Validate editorial queue
        run: python scripts/editorial/verificar_cola.py

      - name: Commit candidate changes
        run: |
          if git diff --quiet -- data/editorial/candidatos.csv data/editorial/cola.csv data/editorial/media data/editorial/state; then
            echo "No editorial changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial/candidatos.csv data/editorial/cola.csv data/editorial/media data/editorial/state
          git commit -m "editorial: ingest and prepare candidates"
          git pull --rebase origin main
          git push
