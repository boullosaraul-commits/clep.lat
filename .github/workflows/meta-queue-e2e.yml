name: Meta queue E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local visual checks
        run: |
          python -m pip install -r scripts/editorial/requirements-visual.txt
          sudo apt-get update && sudo apt-get install -y tesseract-ocr librsvg2-bin
      - name: Verify final asset and Meta payload offline
        run: python -m unittest -v tests/test_visual_policy.py
