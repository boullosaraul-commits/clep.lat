name: Editorial plan

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * *"

permissions:
  contents: write

concurrency:
  group: editorial-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plan approved editorial items
        run: python scripts/editorial/planificar.py
      - name: Validate queue
        run: python scripts/editorial/verificar_cola.py
      - name: Persist schedule
        run: |
          if git diff --quiet -- data/editorial/cola.csv; then
            echo "Nothing ready to schedule."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial/cola.csv
          git commit -m "editorial: plan daily queue"
          git push
