name: Editorial check

on:
  push:
    paths:
      - "data/editorial/**"
      - "scripts/editorial/**"
      - ".github/workflows/editorial-check.yml"
  pull_request:
    paths:
      - "data/editorial/**"
      - "scripts/editorial/**"
      - ".github/workflows/editorial-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate editorial queue
        run: python scripts/editorial/verificar_cola.py
